- title: "自己対戦による人狼AIの開発"
  path: self-play-ai.qmd
  date: 2026-10-31
  description: "霊狩2w（7人村）と9人村を対象に、全員をAIが演じる自己対戦で進行を学習させた記録です。線形方策＋REINFORCE、盤面別学習、情報リークの監査、世代間総当たりで見つかった「第200世代が最強」現象とその原因をまとめました。"
- title: "小さな配役におけるCO戦略の厳密解析"
  path: co-strategy-exact.qmd
  date: 2026-11-01
  description: "村村狩狼と霊狩2wで、霊媒師・狩人のCO日、護衛方針、ローラーの有無を変えた 64 通りの進行を比べました。人狼が騙り・襲撃を最善に選ぶ場合の村勝率を有理数で厳密に計算し、最善の進行（1日目CO＋ローラー、3/10）と、COを遅らせる進行が崩れる仕組みを示します。"
