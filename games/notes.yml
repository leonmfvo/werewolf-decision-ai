- title: "人狼盤面対戦（Werewolf Board Duel）"
  path: board-duel.qmd
  date: 2026-11-02
  description: "人狼ゲームの進行（CO 要請・処刑・占い先・護衛）を、村側と人狼側の 2 人対戦カードゲームにした Web アプリです。ブラウザで友人や CPU と対戦でき、エンジンは CFR などの探索手法に組み込めるよう設計しています。"
- title: "人狼 初日役職当てクイズ"
  path: role-quiz.qmd
  date: 2026-11-02
  description: "人狼Online の実戦ログから、1 日目の昼の議論だけを読んで全員の役職を当てるクイズです。名前は匿名化しています。人間と AI が同じ問題・同じ制限時間・同じ採点で挑み、同じランキングに並びます。"
- title: "推理RPG「百年目の神」"
  path: rpg.qmd
  date: 2026-11-23
  description: "人狼盤面対戦から生まれた、ブラウザで遊べる推理RPGです。村でただ一人処刑を決める「神」に選ばれた主人公として、占い結果や名乗り出からクイズ形式で推理を進めます。全四章で、選択と推理の正誤によって結末が分かれます。"
